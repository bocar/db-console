# 后端测试套件（mvn test：后端 366 例 + 前端构建与 67 例；DM8 实库集成凭据缺失时按跳过计，
# MySQL 集成指向共享远程库、默认按标签排除，需 -Pmysql-it 单独复跑）。
# 只对影响测试结果的路径触发；文档与打包脚本变更不占用 CI 资源（打包另有 packaging-smoke）。
name: backend-tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/backend-tests.yml'

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # frontend-maven-plugin 锁定版本的 Node 安装目录：锁文件未变时复用
      - name: Cache frontend toolchain
        uses: actions/cache@v4
        with:
          path: src/main/webapp/node
          key: frontend-node-${{ hashFiles('src/main/webapp/pnpm-lock.yaml') }}

      - name: Run test suite
        run: mvn -B -ntp test
